<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Las Aventuras Matemáticas de Mateo el Zorro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fox: {
                            light: '#FF9E43',
                            DEFAULT: '#EE5A24',
                            dark: '#C83908',
                        },
                        forest: {
                            light: '#A3CB38',
                            DEFAULT: '#009432',
                            dark: '#006266',
                        }
                    },
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(180deg, #74b9ff 0%, #81ecec 45%, #55efc4 100%);
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pop-in {
            0% { transform: scale(0.6); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%, 75% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
        }

        .animate-bounce-gentle {
            animation: bounce-gentle 2.5s infinite ease-in-out;
        }

        .animate-pop {
            animation: pop-in 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        .bubble-tail::after {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 35px;
            border-width: 14px 14px 0 0;
            border-style: solid;
            border-color: #ffffff transparent transparent transparent;
        }

        @media (max-width: 640px) {
            .bubble-tail::after {
                left: 50%;
                transform: translateX(-50%);
            }
        }

        .apple-btn {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .apple-btn:active {
            transform: scale(0.9);
        }

        .drop-zone {
            min-height: 90px;
            transition: all 0.2s ease;
        }
        .drop-zone.drag-over {
            background-color: #fef08a;
            border-color: #f59e0b;
            transform: scale(1.02);
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col justify-between min-h-screen p-2 sm:p-4 overflow-x-hidden">

    <!-- HEADER / MAP BAR -->
    <header class="w-full max-w-4xl mx-auto bg-white/95 backdrop-blur-md rounded-3xl p-3 sm:p-4 shadow-xl border-4 border-amber-300 flex flex-wrap items-center justify-between gap-2 z-10">
        <!-- Logo -->
        <div class="flex items-center space-x-3">
            <div class="w-12 h-12 bg-fox-light rounded-2xl flex items-center justify-center shadow border-2 border-white text-2xl">
                🦊
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-black text-fox-dark leading-none">Mateo el Zorro</h1>
                <p class="text-xs sm:text-sm font-bold text-emerald-700">Matemáticas 1° Básico</p>
            </div>
        </div>

        <!-- Flow Stages Indicator -->
        <div id="stage-pills" class="flex items-center gap-1 sm:gap-2">
            <span id="pill-1" class="px-2 sm:px-3 py-1 rounded-xl text-xs font-black bg-amber-400 text-amber-950 border border-amber-500">1. Lección 📚</span>
            <span id="pill-2" class="px-2 sm:px-3 py-1 rounded-xl text-xs font-black bg-slate-200 text-slate-500">2. 20 Sumas ➕</span>
            <span id="pill-3" class="px-2 sm:px-3 py-1 rounded-xl text-xs font-black bg-slate-200 text-slate-500">3. Lección 🍃</span>
            <span id="pill-4" class="px-2 sm:px-3 py-1 rounded-xl text-xs font-black bg-slate-200 text-slate-500">4. 20 Restas ➖</span>
        </div>

        <!-- Voice & Star Stats -->
        <div class="flex items-center gap-2">
            <button id="btn-toggle-voice" onclick="toggleVoice()" class="bg-amber-100 hover:bg-amber-200 text-amber-900 p-2 sm:px-3 rounded-2xl font-bold text-xs sm:text-sm border-2 border-amber-300 flex items-center gap-1 transition">
                <span id="voice-icon">🔊</span>
                <span class="hidden md:inline">Voz</span>
            </button>
            <div class="bg-amber-400 text-amber-950 px-3 py-1.5 rounded-2xl font-extrabold text-base flex items-center space-x-1 border-2 border-amber-500 shadow-inner font-outfit">
                <span>⭐</span>
                <span id="star-count">0</span>
            </div>
        </div>
    </header>

    <!-- MAIN APP CARD -->
    <main class="w-full max-w-4xl mx-auto my-3 sm:my-5 flex-grow flex flex-col justify-center">

        <div id="game-card" class="bg-white/95 backdrop-blur-md rounded-3xl p-4 sm:p-8 shadow-2xl border-4 border-emerald-400 min-h-[460px] flex flex-col justify-between relative overflow-hidden">
            
            <!-- MASCOT & DIALOGUE SECTION -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-center mb-2 z-10">
                <!-- Mateo Fox Mascot -->
                <div class="md:col-span-1 flex flex-col items-center justify-center">
                    <div id="mateo-avatar" class="w-28 h-28 sm:w-36 sm:h-36 animate-bounce-gentle cursor-pointer relative" onclick="speakCurrentDialog()">
                        <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-xl">
                            <!-- Ears -->
                            <polygon points="35,70 15,10 75,45" fill="#EE5A24" stroke="#C83908" stroke-width="4"/>
                            <polygon points="40,60 25,20 70,45" fill="#FFEAA7"/>
                            <polygon points="165,70 185,10 125,45" fill="#EE5A24" stroke="#C83908" stroke-width="4"/>
                            <polygon points="160,60 175,20 130,45" fill="#FFEAA7"/>
                            <!-- Head -->
                            <path d="M 25 100 Q 100 20 175 100 Q 185 140 100 185 Q 15 140 25 100 Z" fill="#EE5A24" stroke="#C83908" stroke-width="4"/>
                            <!-- Cheeks -->
                            <path d="M 25 100 Q 65 110 100 185 Q 35 150 25 100 Z" fill="#FFFFFF"/>
                            <path d="M 175 100 Q 135 110 100 185 Q 165 150 175 100 Z" fill="#FFFFFF"/>
                            <!-- Normal Eyes -->
                            <g id="mateo-eyes">
                                <circle cx="65" cy="95" r="12" fill="#2d3436"/>
                                <circle cx="135" cy="95" r="12" fill="#2d3436"/>
                                <circle cx="68" cy="91" r="4" fill="#FFFFFF"/>
                                <circle cx="138" cy="91" r="4" fill="#FFFFFF"/>
                            </g>
                            <!-- Happy Eyes -->
                            <g id="mateo-eyes-happy" class="hidden">
                                <path d="M 53 98 Q 65 82 77 98" fill="none" stroke="#2d3436" stroke-width="6" stroke-linecap="round"/>
                                <path d="M 123 98 Q 135 82 147 98" fill="none" stroke="#2d3436" stroke-width="6" stroke-linecap="round"/>
                            </g>
                            <!-- Nose & Mouth -->
                            <ellipse cx="100" cy="140" rx="13" ry="9" fill="#2d3436"/>
                            <path id="mateo-mouth" d="M 88 152 Q 100 165 112 152" fill="none" stroke="#2d3436" stroke-width="4" stroke-linecap="round"/>
                            <!-- Cheeks Blush -->
                            <ellipse cx="45" cy="115" rx="7" ry="4" fill="#ff7675" opacity="0.6"/>
                            <ellipse cx="155" cy="115" rx="7" ry="4" fill="#ff7675" opacity="0.6"/>
                        </svg>
                        <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 bg-amber-400 text-amber-950 text-[10px] font-black px-2 py-0.5 rounded-full border border-white whitespace-nowrap shadow">
                            ¡Tócame para escuchar! 🔊
                        </div>
                    </div>
                </div>

                <!-- Speech Bubble -->
                <div class="md:col-span-3">
                    <div class="relative bg-white border-4 border-amber-300 rounded-3xl p-4 sm:p-5 shadow-md bubble-tail flex flex-col justify-between min-h-[105px]">
                        <p id="mateo-speech" class="text-lg sm:text-2xl font-bold text-slate-800 leading-snug">
                            ¡Hola! Clic en continuar para empezar a aprender a sumar.
                        </p>
                    </div>
                </div>
            </div>

            <!-- PROGRESS BAR FOR EXERCISES -->
            <div id="progress-container" class="hidden my-2">
                <div class="flex justify-between items-center mb-1 px-1">
                    <span id="progress-text" class="text-xs sm:text-sm font-extrabold text-slate-600">Ejercicio 1 de 20</span>
                    <span id="progress-stars" class="text-xs sm:text-sm font-black text-amber-600">⭐ Practicando</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-3.5 p-0.5 border border-slate-300">
                    <div id="progress-bar-inner" class="bg-gradient-to-r from-amber-400 to-emerald-500 h-2.5 rounded-full transition-all duration-500" style="width: 5%"></div>
                </div>
            </div>

            <!-- MAIN DYNAMIC GRAPHIC CANVAS -->
            <div id="canvas-area" class="my-3 bg-gradient-to-b from-sky-50 to-emerald-50 rounded-3xl p-4 sm:p-6 border-2 border-slate-200 shadow-inner flex flex-col items-center justify-center min-h-[220px]">
                <!-- Injected via JavaScript -->
            </div>

            <!-- ACTION CONTROLS / OPTIONS -->
            <div id="controls-area" class="mt-2 z-10">
                <!-- Injected via JavaScript -->
            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="w-full max-w-4xl mx-auto text-center py-2 text-xs font-extrabold text-slate-700/80">
        Las Aventuras Matemáticas de Mateo • 1° Básico 🇨🇱
    </footer>

    <!-- LOGIC SCRIPT -->
    <script>
        /* ==========================================================================
           AUDIO & VOICE SYNTHESIS (Web Audio API & Speech Synthesis)
           ========================================================================== */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const sfx = {
            playPop() {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.08);
                } catch(e){}
            },
            playClick() {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                } catch(e){}
            },
            playWin() {
                try {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
                        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.2);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(audioCtx.currentTime + idx * 0.1);
                        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.2);
                    });
                } catch(e){}
            },
            playError() {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(140, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } catch(e){}
            },
            playFanfare() {
                try {
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.15);
                        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.15);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.15 + 0.4);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(audioCtx.currentTime + idx * 0.15);
                        osc.stop(audioCtx.currentTime + idx * 0.15 + 0.4);
                    });
                } catch(e){}
            }
        };

        function setMateoHappy(isHappy) {
            const normal = document.getElementById('mateo-eyes');
            const happy = document.getElementById('mateo-eyes-happy');
            if (normal && happy) {
                if (isHappy) {
                    normal.classList.add('hidden');
                    happy.classList.remove('hidden');
                } else {
                    normal.classList.remove('hidden');
                    happy.classList.add('hidden');
                }
            }
        }

        function speakCurrentDialog() {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const text = document.getElementById('mateo-speech').innerText;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 0.9;
            utterance.pitch = 1.2;
            window.speechSynthesis.speak(utterance);
        }

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const icon = document.getElementById('voice-icon');
            if (icon) icon.innerText = voiceEnabled ? '🔊' : '🔇';
            if (!voiceEnabled && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            } else {
                speakCurrentDialog();
            }
        }

        function handleAnswer(selectedAnswer) {
            const gameCard = document.getElementById('game-card');

            if (selectedAnswer === correctAnswer) {
                sfx.playWin();
                setMateoHappy(true);
                streak++;
                if (streak > maxStreak) maxStreak = streak;

                const points = streak > 1 ? 2 : 1;
                stars += points;
                document.getElementById('star-count').innerText = stars;

                document.getElementById('mateo-speech').innerText = 
                    `¡EXCELENTE TRABAJO! 🎉 ${selectedAnswer} es la respuesta correcta. ${streak > 1 ? '¡Llevas racha 🔥!' : ''}`;

                gameCard.classList.add('animate-pop');
                setTimeout(() => gameCard.classList.remove('animate-pop'), 400);

                document.getElementById('controls-area').innerHTML = `
                    <div class="flex justify-center">
                        <button onclick="nextExercise()" class="px-8 py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xl rounded-2xl shadow-lg border-b-4 border-emerald-700 active:scale-95 transition flex items-center space-x-2">
                            <span>Siguiente Ejercicio ➔</span>
                        </button>
                    </div>
                `;
                speakCurrentDialog();
            } else {
                sfx.playError();
                streak = 0;
                setMateoHappy(false);

                gameCard.classList.add('animate-shake');
                setTimeout(() => gameCard.classList.remove('animate-shake'), 400);

                document.getElementById('mateo-speech').innerText = 
                    `¡Casi! Inténtalo de nuevo. Cuenta bien las Cajas de 10 y las Unidades.`;
                speakCurrentDialog();
            }
        }

        /* ==========================================================================
           GAME STATE & FLOW (Linear sequence: 40 total exercises)
           ========================================================================== */
        let currentStage = 1;
        let exerciseIndex = 0; // 0 to 19 (20 exercises per section)
        let totalExercisesPerSection = 20;
        let stars = 0;
        let streak = 0;
        let maxStreak = 0;
        let voiceEnabled = true;

        // Current Exercise Data
        let num1 = 0;
        let num2 = 0;
        let correctAnswer = 0;
        let missingType = 'result';
        
        // Interactive Items State
        let boxAApples = 0;
        let boxBApples = 0;
        let basketApplesCount = 0;
        let removedApplesCount = 0;

        /* ==========================================================================
           STAGE 2: PRACTICE ADDITION (20 Exercises - Two Digits)
           ========================================================================== */
        function renderExerciseAddition() {
            // Progressive difficulty in 20 exercises
            if (exerciseIndex < 7) {
                // Easy 2-digit + 1-digit (e.g. 12 + 5, 20 + 4)
                num1 = Math.floor(Math.random() * 20) + 10;
                num2 = Math.floor(Math.random() * 8) + 1;
            } else if (exerciseIndex < 14) {
                // Moderate 2-digit + 2-digit without regrouping (e.g. 14 + 23, 31 + 15)
                const tens1 = Math.floor(Math.random() * 3) + 1; // 1-3
                const units1 = Math.floor(Math.random() * 5);    // 0-4
                const tens2 = Math.floor(Math.random() * 3) + 1; // 1-3
                const units2 = Math.floor(Math.random() * 5);    // 0-4
                num1 = tens1 * 10 + units1;
                num2 = tens2 * 10 + units2;
            } else {
                // Challenge 2-digit + 2-digit up to 99 (e.g. 45 + 32, 28 + 41)
                num1 = Math.floor(Math.random() * 45) + 10;
                num2 = Math.floor(Math.random() * 40) + 10;
            }

            const types = ['result', 'result', 'boxB', 'boxA'];
            missingType = types[Math.floor(Math.random() * types.length)];

            if (missingType === 'result') {
                correctAnswer = num1 + num2;
                document.getElementById('mateo-speech').innerText = 
                    `🔥 Ejercicio ${exerciseIndex + 1}/20: Suma ${num1} + ${num2}. ¡Usa las Cajas de 10 📦 y las Unidades 🍎!`;
            } else if (missingType === 'boxB') {
                correctAnswer = num2;
                document.getElementById('mateo-speech').innerText = 
                    `🔎 Misterio ${exerciseIndex + 1}/20: Tenemos ${num1}. ¿Cuánto nos falta en la Caja 2 para llegar a ${num1 + num2}?`;
            } else {
                correctAnswer = num1;
                document.getElementById('mateo-speech').innerText = 
                    `🔎 Misterio ${exerciseIndex + 1}/20: ¿Cuánto debemos poner en la Caja 1 si la Caja 2 tiene ${num2} y el total es ${num1 + num2}?`;
            }

            boxAApples = 0;
            boxBApples = 0;

            renderAdditionInteractiveCanvas();
            renderMultipleChoiceButtons();
            speakCurrentDialog();
        }

        function renderAdditionInteractiveCanvas() {
            const canvas = document.getElementById('canvas-area');

            const tensA = Math.floor(boxAApples / 10);
            const unitsA = boxAApples % 10;

            const tensB = Math.floor(boxBApples / 10);
            const unitsB = boxBApples % 10;

            canvas.innerHTML = `
                <div class="flex flex-col items-center justify-center gap-3 w-full">
                    <!-- Tree / Supply Source & Streak Indicator -->
                    <div class="flex flex-wrap items-center justify-between w-full max-w-xl bg-emerald-200/80 px-4 py-2 rounded-2xl border-2 border-emerald-400">
                        <div class="flex items-center gap-2">
                            <span class="text-xs sm:text-sm font-extrabold text-emerald-900">Agregar:</span>
                            <button onclick="addAmountToActiveBox(10)" class="bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1 rounded-xl text-xs font-black shadow active:scale-95 transition">
                                +10 📦 Decena
                            </button>
                            <button onclick="addAmountToActiveBox(1)" class="bg-rose-500 hover:bg-rose-600 text-white px-2.5 py-1 rounded-xl text-xs font-black shadow active:scale-95 transition">
                                +1 🍎 Unidad
                            </button>
                        </div>
                        ${streak > 1 ? `<span class="bg-amber-400 text-amber-950 px-3 py-1 rounded-full text-xs font-black animate-pulse">🔥 Racha x${streak}!</span>` : ''}
                    </div>

                    <!-- Containers -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-xl">
                        <!-- Box A -->
                        <div onclick="addAmountToBox('A', 1)" class="bg-amber-50 rounded-2xl p-3 border-4 ${boxAApples === num1 ? 'border-emerald-500 bg-emerald-50' : 'border-amber-300'} border-dashed text-center flex flex-col justify-between">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-xs font-black text-amber-900">Caja 1: ${missingType === 'boxA' ? '¿?' : num1}</span>
                                <span class="text-xs font-bold text-amber-700">${boxAApples} (${tensA}D + ${unitsA}U)</span>
                            </div>
                            <div class="flex flex-wrap gap-1.5 justify-center items-center min-h-[55px]">
                                ${renderValueBlocks(tensA, unitsA)}
                            </div>
                            <div class="flex justify-center gap-2 mt-2">
                                <button onclick="event.stopPropagation(); addAmountToBox('A', 10)" class="px-2 py-0.5 bg-indigo-100 text-indigo-900 rounded-lg text-[11px] font-black border border-indigo-300">+10</button>
                                <button onclick="event.stopPropagation(); addAmountToBox('A', 1)" class="px-2 py-0.5 bg-rose-100 text-rose-900 rounded-lg text-[11px] font-black border border-rose-300">+1</button>
                                <button onclick="event.stopPropagation(); resetBox('A')" class="px-2 py-0.5 bg-slate-200 text-slate-700 rounded-lg text-[11px] font-black">Borrar</button>
                            </div>
                        </div>

                        <!-- Box B -->
                        <div onclick="addAmountToBox('B', 1)" class="bg-emerald-50 rounded-2xl p-3 border-4 ${boxBApples === num2 ? 'border-emerald-500 bg-emerald-100' : 'border-emerald-300'} border-dashed text-center flex flex-col justify-between">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-xs font-black text-emerald-900">Caja 2: ${missingType === 'boxB' ? '¿?' : num2}</span>
                                <span class="text-xs font-bold text-emerald-700">${boxBApples} (${tensB}D + ${unitsB}U)</span>
                            </div>
                            <div class="flex flex-wrap gap-1.5 justify-center items-center min-h-[55px]">
                                ${renderValueBlocks(tensB, unitsB)}
                            </div>
                            <div class="flex justify-center gap-2 mt-2">
                                <button onclick="event.stopPropagation(); addAmountToBox('B', 10)" class="px-2 py-0.5 bg-indigo-100 text-indigo-900 rounded-lg text-[11px] font-black border border-indigo-300">+10</button>
                                <button onclick="event.stopPropagation(); addAmountToBox('B', 1)" class="px-2 py-0.5 bg-rose-100 text-rose-900 rounded-lg text-[11px] font-black border border-rose-300">+1</button>
                                <button onclick="event.stopPropagation(); resetBox('B')" class="px-2 py-0.5 bg-slate-200 text-slate-700 rounded-lg text-[11px] font-black">Borrar</button>
                            </div>
                        </div>
                    </div>

                    <!-- Dynamic Equation Display -->
                    <div class="text-2xl sm:text-4xl font-black text-slate-800 bg-white px-6 py-2 rounded-2xl border-2 border-slate-200 shadow font-outfit tracking-wider">
                        <span>${missingType === 'boxA' ? '<span class="text-fox-dark font-black underline">?</span>' : num1}</span>
                        <span class="text-emerald-500">+</span>
                        <span>${missingType === 'boxB' ? '<span class="text-fox-dark font-black underline">?</span>' : num2}</span>
                        <span class="text-amber-500">=</span>
                        <span>${missingType === 'result' ? '<span class="text-fox-dark font-black">?</span>' : (num1 + num2)}</span>
                    </div>
                </div>
            `;
        }

        /* Helper for 2-digit visual representation */
        function renderValueBlocks(tens, units) {
            let html = '';
            for (let i = 0; i < tens; i++) {
                html += `<div class="bg-indigo-600 text-white font-black text-[10px] px-1.5 py-1 rounded-md shadow flex items-center gap-0.5">📦 10</div>`;
            }
            for (let i = 0; i < units; i++) {
                html += `<div class="text-base animate-pop">🍎</div>`;
            }
            return html || `<span class="text-xs font-bold text-slate-400">Vacío</span>`;
        }

        function addAmountToBox(box, amount) {
            sfx.playPop();
            if (box === 'A') boxAApples += amount;
            else boxBApples += amount;
            renderAdditionInteractiveCanvas();
        }

        function addAmountToActiveBox(amount) {
            if (boxAApples < num1) addAmountToBox('A', amount);
            else addAmountToBox('B', amount);
        }

        function resetBox(box) {
            sfx.playPop();
            if (box === 'A') boxAApples = 0;
            else boxBApples = 0;
            renderAdditionInteractiveCanvas();
        }

        /* ==========================================================================
           STAGE 4: PRACTICE SUBTRACTION (20 Exercises - Two Digits)
           ========================================================================== */
        function renderExerciseSubtraction() {
            if (exerciseIndex < 7) {
                num1 = Math.floor(Math.random() * 20) + 15; // 15 to 35
                num2 = Math.floor(Math.random() * 8) + 1;   // 1 to 8
            } else if (exerciseIndex < 14) {
                const tens1 = Math.floor(Math.random() * 3) + 3; // 3-5
                const units1 = Math.floor(Math.random() * 5) + 4; // 4-8
                const tens2 = Math.floor(Math.random() * 2) + 1; // 1-2
                const units2 = Math.floor(Math.random() * 4);    // 0-3
                num1 = tens1 * 10 + units1;
                num2 = tens2 * 10 + units2;
            } else {
                num1 = Math.floor(Math.random() * 40) + 45; // 45 to 85
                num2 = Math.floor(Math.random() * 30) + 10; // 10 to 40
            }

            const types = ['result', 'result', 'boxB'];
            missingType = types[Math.floor(Math.random() * types.length)];
            correctAnswer = missingType === 'result' ? (num1 - num2) : num2;

            basketApplesCount = num1;
            removedApplesCount = 0;

            if (missingType === 'result') {
                document.getElementById('mateo-speech').innerText = 
                    `🍃 Ejercicio ${exerciseIndex + 1}/20: Tenías ${num1}. Saca ${num2} del canasto. ¿Cuántas quedan dentro?`;
            } else {
                document.getElementById('mateo-speech').innerText = 
                    `🔎 Misterio de Resta ${exerciseIndex + 1}/20: Tenías ${num1}. ¿Cuántas sacaste si ahora quedan ${num1 - num2}?`;
            }

            renderSubtractionInteractiveCanvas();
            renderMultipleChoiceButtons();
            speakCurrentDialog();
        }

        function renderSubtractionInteractiveCanvas() {
            const canvas = document.getElementById('canvas-area');

            const tensBasket = Math.floor(basketApplesCount / 10);
            const unitsBasket = basketApplesCount % 10;

            const tensRemoved = Math.floor(removedApplesCount / 10);
            const unitsRemoved = removedApplesCount % 10;

            canvas.innerHTML = `
                <div class="flex flex-col items-center justify-center gap-3 w-full">
                    <div class="flex items-center justify-between w-full max-w-xl">
                        ${streak > 1 ? `<span class="bg-amber-400 text-amber-950 px-3 py-1 rounded-full text-xs font-black animate-pulse">🔥 Racha x${streak}!</span>` : '<span></span>'}
                        <span class="bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-black">Dos Dígitos (Decenas y Unidades)</span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 w-full max-w-xl items-center">
                        <!-- Basket Area -->
                        <div class="sm:col-span-2 bg-amber-100/90 rounded-3xl p-3 border-4 border-amber-400 border-dashed text-center flex flex-col justify-between">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-xs font-black text-amber-900">🧺 Canasto: ${basketApplesCount} restantes</span>
                            </div>
                            <div class="flex flex-wrap gap-1.5 justify-center items-center min-h-[60px]">
                                ${renderValueBlocks(tensBasket, unitsBasket)}
                            </div>
                            <div class="flex justify-center gap-2 mt-2">
                                <button onclick="removeAmountFromBasket(10)" class="px-2.5 py-1 bg-rose-600 text-white rounded-xl text-xs font-black shadow active:scale-95 transition">-10 📦</button>
                                <button onclick="removeAmountFromBasket(1)" class="px-2.5 py-1 bg-rose-500 text-white rounded-xl text-xs font-black shadow active:scale-95 transition">-1 🍎</button>
                            </div>
                        </div>

                        <!-- Outside / Removed Area -->
                        <div class="bg-rose-50 rounded-2xl p-3 border-2 border-rose-300 text-center flex flex-col justify-between min-h-[90px]">
                            <span class="text-xs font-black text-rose-800">📦 Fuera</span>
                            <div class="flex flex-wrap gap-1 justify-center items-center my-1">
                                ${renderValueBlocks(tensRemoved, unitsRemoved)}
                            </div>
                            <span class="text-xs font-bold text-rose-600">${removedApplesCount} sacadas</span>
                        </div>
                    </div>

                    <!-- Symbolic Equation -->
                    <div class="text-2xl sm:text-4xl font-black text-slate-800 bg-white px-6 py-2 rounded-2xl border-2 border-slate-200 shadow font-outfit tracking-wider">
                        <span>${num1}</span>
                        <span class="text-rose-500">-</span>
                        <span>${missingType === 'boxB' ? '<span class="text-fox-dark font-black underline">?</span>' : num2}</span>
                        <span class="text-amber-500">=</span>
                        <span>${missingType === 'result' ? '<span class="text-fox-dark font-black">?</span>' : (num1 - num2)}</span>
                    </div>
                </div>
            `;
        }

        function removeAmountFromBasket(amount) {
            if (basketApplesCount >= amount) {
                sfx.playPop();
                basketApplesCount -= amount;
                removedApplesCount += amount;
                renderSubtractionInteractiveCanvas();
            }
        }

        /* ==========================================================================
           MULTIPLE CHOICE BUTTONS GENERATOR (Adapts to 2-digit range)
           ========================================================================== */
        function renderMultipleChoiceButtons() {
            const options = new Set();
            options.add(correctAnswer);

            while (options.size < 4) {
                let offset = (Math.floor(Math.random() * 5) - 2) * (Math.random() > 0.5 ? 1 : 10);
                if (offset === 0) offset = 2;
                let wrong = correctAnswer + offset;
                if (wrong >= 0 && wrong <= 99 && wrong !== correctAnswer) {
                    options.add(wrong);
                }
            }

            const shuffledOptions = Array.from(options).sort(() => Math.random() - 0.5);

            let btnsHTML = '';
            shuffledOptions.forEach(opt => {
                btnsHTML += `
                    <button onclick="handleAnswer(${opt})" class="w-16 h-16 sm:w-20 sm:h-20 bg-amber-400 hover:bg-amber-500 text-amber-950 font-black text-2xl sm:text-3xl rounded-2xl shadow-lg border-b-4 border-amber-600 active:scale-90 transition flex items-center justify-center font-outfit">
                        ${opt}
                    </button>
                `;
            });

            document.getElementById('controls-area').innerHTML = `
                <div class="flex flex-col items-center">
                    <span class="text-xs font-black text-slate-500 mb-2 uppercase">Elige la respuesta correcta:</span>
                    <div class="flex flex-wrap justify-center gap-3">
                        ${btnsHTML}
                    </div>
                </div>
            `;
        }

        /* ==========================================================================
           STAGE PROGRESSION (20 + 20 = 40 total exercises)
           ========================================================================== */
        function nextExercise() {
            sfx.playClick();
            exerciseIndex++;

            if (exerciseIndex >= totalExercisesPerSection) {
                if (currentStage === 2) {
                    currentStage = 3; // Move to Subtraction Lesson
                } else if (currentStage === 4) {
                    currentStage = 5; // Move to Diploma
                }
                exerciseIndex = 0;
            }

            loadCurrentStage();
        }

        function updateProgressBar() {
            document.getElementById('progress-text').innerText = `Ejercicio ${exerciseIndex + 1} de ${totalExercisesPerSection}`;
            const percent = ((exerciseIndex + 1) / totalExercisesPerSection) * 100;
            document.getElementById('progress-bar-inner').style.width = `${percent}%`;
        }

        function renderDiplomaScreen() {
            sfx.playFanfare();
            updateStagePills();
            setMateoHappy(true);

            document.getElementById('mateo-speech').innerText = 
                "¡SOBRESALIENTE! 🏆 Completaste los 40 ejercicios de sumas y restas de dos dígitos. ¡Eres un Verdadero Maestro Matemático!";

            const canvas = document.getElementById('canvas-area');
            canvas.innerHTML = `
                <div class="flex flex-col items-center justify-center text-center p-4 bg-white rounded-3xl border-4 border-amber-300 shadow-xl w-full">
                    <div class="text-5xl sm:text-6xl mb-2 animate-bounce-gentle">🎓🏆⭐</div>
                    <h2 class="text-2xl sm:text-4xl font-black text-fox-dark uppercase tracking-wide">DIPLOMA DE HONOR DE DOS DÍGITOS</h2>
                    <p class="text-sm sm:text-base font-extrabold text-emerald-700 mt-1">Otorgado al Gran Campeón de Matemáticas</p>
                    
                    <div class="my-4 p-3 bg-amber-50 rounded-2xl border-2 border-amber-200 w-full max-w-md">
                        <p class="text-slate-700 font-bold text-sm sm:text-base">
                            Por completar exitosamente los <span class="text-fox-dark font-black">40 Desafíos Matemáticos</span> con Decenas y Unidades junto a Mateo el Zorro.
                        </p>
                        <div class="flex justify-center items-center gap-2 mt-2 text-2xl font-black text-amber-500 font-outfit">
                            <span>⭐ ${stars} Estrellas Conseguidas ⭐</span>
                        </div>
                    </div>

                    <span class="text-xs font-bold text-slate-400 uppercase">Profesor Mateo el Zorro 🦊 • 1° Básico</span>
                </div>
            `;

            document.getElementById('controls-area').innerHTML = `
                <div class="flex justify-center">
                    <button onclick="sfx.playClick(); currentStage = 1; exerciseIndex = 0; stars = 0; document.getElementById('star-count').innerText = 0; loadCurrentStage();" class="px-8 py-4 bg-amber-400 hover:bg-amber-500 text-amber-950 font-black text-xl rounded-2xl shadow-lg border-b-4 border-amber-600 active:scale-95 transition flex items-center space-x-2">
                        <span>🔄 Reiniciar 40 Ejercicios</span>
                    </button>
                </div>
            `;

            speakCurrentDialog();
        }

        /* ==========================================================================
           STAGE & NAVIGATION MANAGER
           ========================================================================== */
        function loadCurrentStage() {
            setMateoHappy(false);
            updateStagePills();

            const progContainer = document.getElementById('progress-container');

            if (currentStage === 1) {
                // Lesson: Addition
                progContainer.classList.add('hidden');
                renderLessonAddition();
            } else if (currentStage === 2) {
                // Practice: Addition
                progContainer.classList.remove('hidden');
                updateProgressBar();
                renderExerciseAddition();
            } else if (currentStage === 3) {
                // Lesson: Subtraction
                progContainer.classList.add('hidden');
                renderLessonSubtraction();
            } else if (currentStage === 4) {
                // Practice: Subtraction
                progContainer.classList.remove('hidden');
                updateProgressBar();
                renderExerciseSubtraction();
            } else if (currentStage === 5) {
                // Final Diploma
                progContainer.classList.add('hidden');
                renderDiplomaScreen();
            }
        }

        function updateStagePills() {
            for (let i = 1; i <= 4; i++) {
                const pill = document.getElementById(`pill-${i}`);
                if (!pill) continue;
                if (i === currentStage) {
                    pill.className = "px-2 sm:px-3 py-1 rounded-xl text-xs font-black bg-amber-400 text-amber-950 border border-amber-500 shadow";
                } else if (i < currentStage) {
                    pill.className = "px-2 sm:px-3 py-1 rounded-xl text-xs font-black bg-emerald-500 text-white";
                } else {
                    pill.className = "px-2 sm:px-3 py-1 rounded-xl text-xs font-black bg-slate-200 text-slate-500";
                }
            }
        }

        function updateProgressBar() {
            document.getElementById('progress-text').innerText = `Ejercicio ${exerciseIndex + 1} de 10`;
            const percent = ((exerciseIndex + 1) / 10) * 100;
            document.getElementById('progress-bar-inner').style.width = `${percent}%`;
        }

        /* ==========================================================================
           LESSON RENDERERS
           ========================================================================== */
        function renderLessonAddition() {
            document.getElementById('mateo-speech').innerText = 
                "¡Sumar es JUNTAR objetos! 🍎 Si ponemos 2 manzanas en una caja y 1 manzana en otra... ¡en total tenemos 3 manzanas!";
            
            const canvas = document.getElementById('canvas-area');
            canvas.innerHTML = `
                <div class="flex flex-col items-center justify-center gap-4 w-full">
                    <div class="flex items-center justify-center gap-3 sm:gap-6">
                        <div class="bg-amber-100 p-3 sm:p-4 rounded-2xl border-2 border-amber-300 text-center">
                            <span class="text-xs font-black text-amber-900 block mb-1">Caja 1</span>
                            <div class="flex gap-1">${getAppleHTML('', 'red')}${getAppleHTML('', 'red')}</div>
                            <span class="text-xl font-black text-amber-900 font-outfit mt-1 block">2</span>
                        </div>
                        <span class="text-3xl font-black text-emerald-600">+</span>
                        <div class="bg-emerald-100 p-3 sm:p-4 rounded-2xl border-2 border-emerald-300 text-center">
                            <span class="text-xs font-black text-emerald-900 block mb-1">Caja 2</span>
                            <div class="flex gap-1">${getAppleHTML('', 'green')}</div>
                            <span class="text-xl font-black text-emerald-900 font-outfit mt-1 block">1</span>
                        </div>
                        <span class="text-3xl font-black text-amber-500">=</span>
                        <div class="bg-amber-300 p-3 sm:p-4 rounded-2xl border-2 border-amber-500 text-center shadow">
                            <span class="text-xs font-black text-amber-950 block mb-1">Total</span>
                            <div class="flex gap-1">${getAppleHTML('', 'red')}${getAppleHTML('', 'red')}${getAppleHTML('', 'green')}</div>
                            <span class="text-xl font-black text-amber-950 font-outfit mt-1 block">3</span>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('controls-area').innerHTML = `
                <div class="flex justify-center">
                    <button onclick="sfx.playClick(); currentStage = 2; exerciseIndex = 0; loadCurrentStage();" class="px-8 py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xl rounded-2xl shadow-lg border-b-4 border-emerald-700 active:scale-95 transition flex items-center space-x-2">
                        <span>¡Empezar a Sumar!</span>
                        <span>🚀</span>
                    </button>
                </div>
            `;

            speakCurrentDialog();
        }

        function renderLessonSubtraction() {
            document.getElementById('mateo-speech').innerText = 
                "¡Restar es QUITAR objetos! 🍃 Si teníamos 4 manzanas en la canasta y nos comemos 1... ¡nos quedan 3 manzanas!";
            
            const canvas = document.getElementById('canvas-area');
            canvas.innerHTML = `
                <div class="flex flex-col items-center justify-center gap-4 w-full">
                    <div class="flex items-center justify-center gap-3 sm:gap-6">
                        <div class="bg-amber-100 p-3 sm:p-4 rounded-2xl border-2 border-amber-300 text-center">
                            <span class="text-xs font-black text-amber-900 block mb-1">Tenías</span>
                            <div class="flex gap-1">${getAppleHTML('', 'red')}${getAppleHTML('', 'red')}${getAppleHTML('', 'red')}${getAppleHTML('', 'red')}</div>
                            <span class="text-xl font-black text-amber-900 font-outfit mt-1 block">4</span>
                        </div>
                        <span class="text-3xl font-black text-rose-500">-</span>
                        <div class="bg-rose-100 p-3 sm:p-4 rounded-2xl border-2 border-rose-300 text-center opacity-60">
                            <span class="text-xs font-black text-rose-900 block mb-1">Quitamos</span>
                            <div class="flex gap-1">${getAppleHTML('', 'red')}</div>
                            <span class="text-xl font-black text-rose-900 font-outfit mt-1 block">1</span>
                        </div>
                        <span class="text-3xl font-black text-amber-500">=</span>
                        <div class="bg-amber-300 p-3 sm:p-4 rounded-2xl border-2 border-amber-500 text-center shadow">
                            <span class="text-xs font-black text-amber-950 block mb-1">Quedan</span>
                            <div class="flex gap-1">${getAppleHTML('', 'red')}${getAppleHTML('', 'red')}${getAppleHTML('', 'red')}</div>
                            <span class="text-xl font-black text-amber-950 font-outfit mt-1 block">3</span>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('controls-area').innerHTML = `
                <div class="flex justify-center">
                    <button onclick="sfx.playClick(); currentStage = 4; exerciseIndex = 0; loadCurrentStage();" class="px-8 py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xl rounded-2xl shadow-lg border-b-4 border-emerald-700 active:scale-95 transition flex items-center space-x-2">
                        <span>¡Empezar a Restar!</span>
                        <span>🚀</span>
                    </button>
                </div>
            `;

            speakCurrentDialog();
        }

        /* ==========================================================================
           INTERACTIVE APPLE HELPERS & DRAG & DROP
           ========================================================================== */
        function getAppleHTML(label = '', color = 'red', onclickAction = '', draggable = false) {
            const appleSvg = color === 'red' ? 
                `<svg viewBox="0 0 100 100" class="w-8 h-8 sm:w-10 sm:h-10 drop-shadow">
                    <path d="M50,25 C40,10 20,15 15,35 C8,65 35,90 50,90 C65,90 92,65 85,35 C80,15 60,10 50,25 Z" fill="#ff4d4d"/>
                    <path d="M50,25 Q55,10 65,12" stroke="#795548" stroke-width="5" fill="none" stroke-linecap="round"/>
                    <path d="M52,18 C60,14 65,18 68,22 C62,26 55,22 52,18 Z" fill="#4caf50"/>
                    <ellipse cx="35" cy="35" rx="4" ry="8" fill="#ffffff" opacity="0.4" transform="rotate(-20 35 35)"/>
                </svg>` :
                `<svg viewBox="0 0 100 100" class="w-8 h-8 sm:w-10 sm:h-10 drop-shadow">
                    <path d="M50,25 C40,10 20,15 15,35 C8,65 35,90 50,90 C65,90 92,65 85,35 C80,15 60,10 50,25 Z" fill="#2ecc71"/>
                    <path d="M50,25 Q55,10 65,12" stroke="#795548" stroke-width="5" fill="none" stroke-linecap="round"/>
                    <path d="M52,18 C60,14 65,18 68,22 C62,26 55,22 52,18 Z" fill="#27ae60"/>
                    <ellipse cx="35" cy="35" rx="4" ry="8" fill="#ffffff" opacity="0.4" transform="rotate(-20 35 35)"/>
                </svg>`;

            return `
                <div ${onclickAction ? `onclick="event.stopPropagation(); ${onclickAction};"` : ''} 
                     ${draggable ? `draggable="true" ondragstart="handleDragStart(event)"` : ''}
                     class="apple-btn cursor-pointer inline-flex flex-col items-center justify-center animate-pop">
                    ${appleSvg}
                    ${label ? `<span class="text-[10px] font-black text-amber-900 leading-none">${label}</span>` : ''}
                </div>
            `;
        }

        function addAppleToBox(targetBox) {
            sfx.playPop();
            if (targetBox === 'A') {
                boxAApples++;
            } else {
                boxBApples++;
            }
            renderAdditionInteractiveCanvas(exerciseIndex >= 5);
        }

        function addAppleToActiveBox() {
            if (boxAApples < num1) {
                addAppleToBox('A');
            } else {
                addAppleToBox('B');
            }
        }

        function removeAppleFromBox(targetBox) {
            sfx.playPop();
            if (targetBox === 'A' && boxAApples > 0) boxAApples--;
            if (targetBox === 'B' && boxBApples > 0) boxBApples--;
            renderAdditionInteractiveCanvas(exerciseIndex >= 5);
        }

        function removeAppleFromBasket() {
            if (basketApplesCount > 0) {
                sfx.playPop();
                basketApplesCount--;
                removedApplesCount++;
                renderSubtractionInteractiveCanvas(exerciseIndex >= 5);
            }
        }

        /* Drag and Drop functions */
        function allowDrop(ev) {
            ev.preventDefault();
            if (ev.currentTarget.classList) ev.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(ev) {
            if (ev.currentTarget.classList) ev.currentTarget.classList.remove('drag-over');
        }

        function handleDragStart(ev) {
            ev.dataTransfer.setData("text", "apple");
        }

        function handleDrop(ev, targetBox) {
            ev.preventDefault();
            if (ev.currentTarget.classList) ev.currentTarget.classList.remove('drag-over');
            addAppleToBox(targetBox);
        }

        function handleDropOutside(ev) {
            ev.preventDefault();
            if (ev.currentTarget.classList) ev.currentTarget.classList.remove('drag-over');
            removeAppleFromBasket();
        }

        /* Multiple Choice Buttons Generator */
        function renderMultipleChoiceButtons() {
            const options = new Set();
            options.add(correctAnswer);

            while (options.size < 4) {
                let offset = Math.floor(Math.random() * 5) - 2;
                let wrong = correctAnswer + offset;
                if (wrong >= 0 && wrong <= 20 && wrong !== correctAnswer) {
                    options.add(wrong);
                }
            }

            const shuffledOptions = Array.from(options).sort(() => Math.random() - 0.5);

            let btnsHTML = '';
            shuffledOptions.forEach(opt => {
                btnsHTML += `
                    <button onclick="handleAnswer(${opt})" class="w-16 h-16 sm:w-20 sm:h-20 bg-amber-400 hover:bg-amber-500 text-amber-950 font-black text-2xl sm:text-3xl rounded-2xl shadow-lg border-b-4 border-amber-600 active:scale-90 transition flex items-center justify-center font-outfit">
                        ${opt}
                    </button>
                `;
            });

            document.getElementById('controls-area').innerHTML = `
                <div class="flex flex-col items-center">
                    <span class="text-xs font-black text-slate-500 mb-2 uppercase">Elige la respuesta correcta:</span>
                    <div class="flex flex-wrap justify-center gap-3">
                        ${btnsHTML}
                    </div>
                </div>
            `;
        }

        /* ==========================================================================
           INIT ON LOAD
           ========================================================================== */
        window.onload = function() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
            }
            loadCurrentStage();
        };
    </script>
</body>
</html>
